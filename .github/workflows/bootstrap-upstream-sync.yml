name: Bootstrap selective upstream sync

on:
  push:
    branches:
      - sync/upstream-2026-08-29
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: sync/upstream-2026-08-29

      - name: Setup build environment
        uses: ./.github/reusable-workflows/setup-gradle
        with:
          java-version: 21

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply reviewed upstream changes
        shell: bash
        run: bash scripts/bootstrap-upstream-sync.sh
