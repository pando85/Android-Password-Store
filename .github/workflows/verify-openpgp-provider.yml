name: Verify OpenPGP provider branch

on:
  push:
    branches:
      - feature/openpgp-provider

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup build environment
        uses: ./.github/reusable-workflows/setup-gradle
        with:
          java-version: 21
      - name: Check style and focused tests
        run: ./gradlew spotlessCheck :app:testDebugUnitTest :passkeys:core:test :passkeys:provider:testDebugUnitTest :crypto:pgpainless:test
