name: Apply OpenPGP backend integration

on:
  push:
    branches: [feature/openpgp-api-backend]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply external OpenPGP integration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/openpgp-api-backend

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply integration and formatting
        run: |
          python .github/apply-openpgp-backend.py
          ./gradlew spotlessApply
          rm .github/apply-openpgp-backend.py
          rm .github/workflows/apply-openpgp-backend.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pgp): apply external OpenPGP integration"
          git push origin HEAD:feature/openpgp-api-backend
